# ===================================================================
# GDELT Sources Configuration
# The pipeline still reads this file through the existing rss_sources
# key, but sources now use GDELT Doc API queries instead of RSS feeds.
# Each GDELT source is converted into RSS-like raw entries so the
# downstream normalize/clean/enrich/export stages can stay the same.
# ===================================================================

rss_sources:

  - name: gdelt_us_business
    source_type: gdelt
    query: '(business OR earnings OR revenue OR profit OR guidance OR layoffs) sourcecountry:US'
    timespan: 7d
    maxrecords: 50
    sort: datedesc
    sourcelang: english
    category: business
    credibility: high

  - name: gdelt_us_markets
    source_type: gdelt
    query: '("stock market" OR stocks OR equities OR shares OR "Wall Street") sourcecountry:US'
    timespan: 7d
    maxrecords: 50
    sort: datedesc
    sourcelang: english
    category: markets
    credibility: high

  - name: gdelt_us_corporate_events
    source_type: gdelt
    query: '(merger OR acquisition OR lawsuit OR investigation OR bankruptcy OR downgrade OR upgrade) sourcecountry:US'
    timespan: 7d
    maxrecords: 50
    sort: datedesc
    sourcelang: english
    category: corporate_events
    credibility: high

  - name: gdelt_us_technology
    source_type: gdelt
    query: '(technology OR semiconductor OR software OR "artificial intelligence" OR cloud) sourcecountry:US'
    timespan: 7d
    maxrecords: 50
    sort: datedesc
    sourcelang: english
    category: technology
    credibility: high

  # Optional company-watchlist mode, similar to scripts/gdelt/populate_unlabeled_data.py.
  # This loops over config/company_tickers.csv and can make many API calls.
